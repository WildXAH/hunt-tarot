<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hunt: Showdown — Tarot Cards</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- =========================
         Header
         ========================= -->

<header class="site-header">

    <h1 id="page-title">
        HUNT: SHOWDOWN
    </h1>

    <div class="site-subtitle-row">

        <p id="page-subtitle">
            Tarot Cards
        </p>

        <span class="subtitle-divider">|</span>

        <div
            class="language-switcher"
            id="language-switcher"
        >
            <button
                type="button"
                class="language-button active"
                data-language="ru"
            >
                RU
            </button>

            <span class="language-divider">/</span>

            <button
                type="button"
                class="language-button"
                data-language="en"
            >
                EN
            </button>
        </div>

    </div>

</header>


    <!-- =========================
         Search
         ========================= -->

    <section class="search-section">

        <label
            for="search-input"
            class="search-label"
            id="search-label"
        >
            Поиск карт Таро
        </label>

        <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Поиск по названию, эффекту или ключевому слову..."
            autocomplete="off"
        >

        <div
            id="category-filters"
            class="category-filters"
        ></div>

        <p
            id="search-results"
            class="search-results"
        ></p>

    </section>


    <!-- =========================
         Tarot cards
         ========================= -->

    <main class="cards-container">
    </main>


    <!-- =========================
         Empty state
         ========================= -->

    <div
        id="empty-state"
        class="empty-state"
    >

        <h2 id="empty-title">
            Карты не найдены
        </h2>

        <p id="empty-text">
            Попробуйте изменить поисковый запрос или категорию.
        </p>

    </div>


    <!-- =========================
         Modal
         ========================= -->

    <div
        class="modal"
        id="card-modal"
    >

        <div class="modal-content">


            <!-- Previous card -->

            <button
                class="modal-nav modal-prev"
                type="button"
                aria-label="Предыдущая карта"
            >
                ←
            </button>


            <!-- Next card -->

            <button
                class="modal-nav modal-next"
                type="button"
                aria-label="Следующая карта"
            >
                →
            </button>


            <!-- Counter -->

            <div
                class="modal-counter"
                id="modal-counter"
            >
                1 / 14
            </div>


            <!-- Close -->

            <button
                class="modal-close"
                type="button"
                aria-label="Закрыть"
            >
                ×
            </button>


            <!-- Card image -->

            <div class="modal-image">

                <img
                    id="modal-card-image"
                    src=""
                    alt=""
                    decoding="async"
                >

            </div>


            <!-- Card information -->

            <div class="modal-info">

                <h2 id="modal-card-name"></h2>

                <span
                    id="modal-card-category"
                    class="card-category"
                ></span>

                <p
                    id="modal-card-effect"
                    class="modal-effect"
                ></p>


                <!-- Warning -->

                <p
                    id="modal-card-warning"
                    class="modal-warning"
                ></p>


                <!-- Description -->

                <div class="modal-description">

                    <h3 id="description-title">
                        Описание
                    </h3>

                    <p id="modal-card-description"></p>

                </div>


                <!-- Keywords -->

                <div class="modal-keywords">

                    <h3 id="keywords-title">
                        Ключевые слова
                    </h3>

                    <div
                        id="modal-card-keywords"
                    ></div>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         JavaScript
         ========================= -->

    <script src="js/cards.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
