<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hunt: Showdown — Tarot Cards</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <h1>HUNT: SHOWDOWN</h1>
        <p>Tarot Cards</p>
    </header>

    <section class="search-section">

      <label for="search-input" class="search-label">
          Search Tarot Cards
      </label>

      <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search by name, effect or keyword..."
          autocomplete="off"
      >

      <div id="category-filters" class="category-filters"></div>

      <p id="search-results" class="search-results"></p>
      

    </section>

    <main class="cards-container">
    </main>

    <div id="empty-state" class="empty-state">
      <h2>No cards found</h2>
     <p>Try another search or category.</p>
    </div>

    <div class="modal" id="card-modal">

      <div class="modal-content">

        <button
        class="modal-nav modal-prev"
        type="button"
        aria-label="Previous card"
        >
            ←
        </button>

        <button
            class="modal-nav modal-next"
            type="button"
            aria-label="Next card"
        >
            →
        </button>

        <div class="modal-counter" id="modal-counter">
           1 / 14
        </div>

          <button class="modal-close" type="button" aria-label="Close">
              ×
          </button>

          <div class="modal-image">
              <img 
                  id="modal-card-image" 
                  src="" 
                  alt=""
                  decoding="async"
              >
          </div>

          <div class="modal-info">

              <h2 id="modal-card-name"></h2>

              <span id="modal-card-category" class="card-category"></span>

              <p id="modal-card-effect" class="modal-effect"></p>

              <p id="modal-card-warning" class="modal-warning"></p>

              <div class="modal-description">
                  <h3>Description</h3>
                  <p id="modal-card-description"></p>
              </div>

              <div class="modal-keywords">
                  <h3>Keywords</h3>
                  <div id="modal-card-keywords"></div>
              </div>

          </div>

      </div>

    </div>

    <script src="js/cards.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
